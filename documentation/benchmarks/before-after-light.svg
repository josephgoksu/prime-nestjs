<text x="456" y="239" font-size="12" fill="#52514e">GET /tasks with a JWT, req/s, higher is better</text>
<text x="596" y="267" font-size="12" text-anchor="end" fill="#52514e" font-weight="400">v1 (NestJS 11)</text>
